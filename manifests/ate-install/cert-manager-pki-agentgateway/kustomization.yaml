# Overlay: cert-manager PKI (see ../cert-manager-pki) with the agentgateway
# dataplane swapped in for Envoy. The agentgateway component only rewires the
# router's second container and its config; the certificate paths its config
# references (/run/servicedns.podcert.ate.dev, /run/podidentity.podcert.ate.dev)
# are satisfied by the cert-manager Secret/ConfigMap volume swaps in the parent
# overlay, at the same mount points.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../cert-manager-pki

components:
  - ../components/agentgateway
