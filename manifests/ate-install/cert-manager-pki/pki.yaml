# cert-manager replacement for the podcertcontroller signers, for clusters
# without the PodCertificateRequest / ClusterTrustBundle feature gates.
#
# A self-signed bootstrap issuer mints two long-lived CAs that mirror the two
# in-tree signers:
#   servicedns.podcert.ate.dev/identity  -> ClusterIssuer servicedns-ca
#   podidentity.podcert.ate.dev/identity -> ClusterIssuer podidentity-ca
#
# The CA Certificates live in the cert-manager namespace because ClusterIssuer
# CA secrets are read from cert-manager's cluster-resource-namespace, which
# defaults to the namespace cert-manager is installed in.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ate-selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: servicedns-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: servicedns.podcert.ate.dev
  secretName: servicedns-ca
  duration: 87600h # 10 years; functional-verification PKI, not production.
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: ate-selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: podidentity-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: podidentity.podcert.ate.dev
  secretName: podidentity-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: ate-selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: servicedns-ca
spec:
  ca:
    secretName: servicedns-ca
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: podidentity-ca
spec:
  ca:
    secretName: podidentity-ca
