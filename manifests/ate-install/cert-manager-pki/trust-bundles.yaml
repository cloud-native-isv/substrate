# trust-manager Bundles replacing the clusterTrustBundle projected-volume
# sources. Each Bundle syncs a ConfigMap into every namespace, mirroring how
# kubelet projected ClusterTrustBundles cluster-wide. Requires trust-manager
# installed in the cert-manager namespace (its default trust namespace), where
# the CA secrets from pki.yaml live:
#
#   helm upgrade -i trust-manager oci://quay.io/jetstack/charts/trust-manager \
#     -n cert-manager --wait
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: servicedns-ca-bundle
spec:
  sources:
  - secret:
      name: servicedns-ca
      key: tls.crt
  target:
    configMap:
      key: trust-bundle.pem
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: podidentity-ca-bundle
spec:
  sources:
  - secret:
      name: podidentity-ca
      key: tls.crt
  target:
    configMap:
      key: trust-bundle.pem
---
# valkey's tls-ca-cert-file serves double duty: verifying client certificates
# (podidentity CA) and verifying peer serving certificates during cluster-bus
# and replication traffic (servicedns CA), so it needs both roots in one file.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: valkey-ca-bundle
spec:
  sources:
  - secret:
      name: servicedns-ca
      key: tls.crt
  - secret:
      name: podidentity-ca
      key: tls.crt
  target:
    configMap:
      key: ca.crt
