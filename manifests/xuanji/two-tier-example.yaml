# Example manifests for the two-tier sandbox model (ADR 0002, Proposed;
# terminology unified with upstream substrate on 2026-09-17; supervisor semantics removed).
#
# TARGET SCHEMA SKETCH — fields marked (sketch) are not yet implemented;
# they define the goal semantics for the follow-up feature. Legacy single-tier
# wasm pools remain in wasm-example.yaml / wasm-tiers-example.yaml.
#
# Topology (two planes, ADR 0002, substrate vocabulary — NO new SandboxClass enum):
#   Tier-1 worker pod plane : Kubernetes + Substrate + Containerd + runc/rund;
#                             worker pod = sandbox class `wasm` in kata form
#                             (WorkerPool.runtimeClassName: rund), pooled warm,
#                             hosts 1 RUNNING actor by default, returned to pool
#                             on SuspendActor (K8s-ecosystem reuse, low-frequency
#                             lifecycle + high stability, sleep/wake)
#   Tier-2 workload plane   : e2b + 自研管控 + wasm workload inside the worker pod
#                             (actor execution body = wasm sandbox; per-request
#                             workload execution = context, destroy-after-use;
#                             wasm = high-frequency creation, isolation, audit,
#                             Capability-based security)
#
# Before applying (once implemented), replace:
#   - <ATEOM_WASMD_IMAGE>: pinned ateom image (wasm class herder, evolved ateom-wasmd; ACR EE @sha256:...)
#   - python-wasm asset url/sha256: object storage location of python-3.12.0.wasm

apiVersion: v1
kind: Namespace
metadata:
  name: ate-wasm

---

# Warm pool of unbound worker pods (kata containers), sandbox class `wasm`.
# The wasm SandboxConfig (wasm-default, see wasm-example.yaml) stays in effect
# — its python-wasm asset is the workload module consumed by the ateom herder
# inside the kata worker pod; the pod image itself comes from ateomImage.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: wasm-pool-rund
  namespace: ate-wasm
spec:
  replicas: 3
  sandboxClass: wasm
  ateomImage: <ATEOM_WASMD_IMAGE>        # ateom (wasm class herder / wasm host): per-request context spawn/destroy + 出口代理 + capability 校验 + 审计流
  runtimeClassName: rund                 # (sketch, xuanji extension) kata/rund RuntimeClass on ACK; unset = legacy runc single-layer pool
  template:
    resources:
      requests: {cpu: "2000m", memory: "4Gi"}
      limits:   {cpu: "4000m", memory: "8Gi"}

---

# Actor template: actor = session; execution body = wasm sandbox inside the
# worker pod; per-request unit = workload execution (context).
apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: python-session
  namespace: ate-wasm
spec:
  sandboxClass: wasm                     # upstream field, existing enum value — no schema change
  sessionConfigRef: session-python-default   # (sketch) platform-authoritative actor config, injected at ResumeActor
  egressPolicy:                          # (sketch) enforced by the ateom egress proxy (tier-2)
    defaultDeny: true
    allow:
      - host: pypi.org
        ports: [443]
      - host: files.pythonhosted.org
        ports: [443]
  capabilities:                          # (sketch) granted to each request-scoped context
    - cap:fs:actor-config:ro
    - cap:fs:workspace:rw:scratch
    - cap:net:egress:actor-token
  workloadLifecycle: destroy-after-use   # (sketch) no snapshot/restore for contexts
