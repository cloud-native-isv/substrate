# ACK (Alibaba Cloud Container Service) overlay for the wasm sandbox class.
#
# Purpose: bring up the *control plane only*, enough to exercise the wasm class
# through create -> RUNNING -> suspend -> resume (migration milestone M2). The
# data plane (atenet router + DNS) is deliberately excluded: the wasm class has
# no per-actor HTTP endpoint before M4, so there is nothing for it to route to,
# and its envoy/coredns images are unreachable from this region anyway.
#
# Differences from the kind overlay this is derived from:
#   - no atenet-router / atenet-dns (M4), no prometheus / otel-collector
#   - every image redirected to the team ACR (docker.io, gcr.io and the
#     registry.k8s.io blob backend are all unreachable from cn-hangzhou)
#   - imagePullSecrets on the ate-system default ServiceAccount, since the ACR
#     is an authenticated enterprise instance
#   - rustfs keeps the kind credentials (rustfsadmin/rustfsadmin): it is the
#     stand-in object store for M2. Switching to OSS means pointing atelet's
#     AWS_* env at the OSS S3-compatible endpoint and setting
#     AWS_S3_USE_PATH_STYLE=false (OSS wants virtual-hosted style).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../ate-install/ate-api-server.yaml
  - ../../ate-install/ate-controller.yaml
  - ./atelet
  - ../../ate-install/valkey.yaml
  - ../../ate-install/pod-certificate-controller.yaml
  - ../../ate-install/kind/ate-otel-config.yaml
  - rustfs.yaml

images:
  # The four control-plane binaries are referenced as ko:// in the upstream
  # manifests, which normally means `ko resolve` builds and pushes them at
  # install time. They are pre-built and pushed to the team ACR instead (see
  # docs/tasks in the sandbox repo), so map the ko import paths directly: the
  # overlay then applies with plain kubectl, no Go toolchain or registry
  # credentials needed on the machine running the install.
  - name: ko://github.com/agent-substrate/substrate/cmd/ateapi
    newName: wasm-agent-registry-vpc.cn-hangzhou.cr.aliyuncs.com/wasm-poc/ateapi
    newTag: v0.1.0-20260811
  - name: ko://github.com/agent-substrate/substrate/cmd/atecontroller
    newName: wasm-agent-registry-vpc.cn-hangzhou.cr.aliyuncs.com/wasm-poc/atecontroller
    newTag: v0.1.0-20260811
  - name: ko://github.com/agent-substrate/substrate/cmd/atelet
    newName: wasm-agent-registry-vpc.cn-hangzhou.cr.aliyuncs.com/wasm-poc/atelet
    newTag: v0.1.0-20260811
  - name: ko://github.com/agent-substrate/substrate/cmd/podcertcontroller
    newName: wasm-agent-registry-vpc.cn-hangzhou.cr.aliyuncs.com/wasm-poc/podcertcontroller
    newTag: v0.1.0-20260811
  - name: valkey/valkey
    newName: wasm-agent-registry-vpc.cn-hangzhou.cr.aliyuncs.com/wasm-poc/valkey
    newTag: "9.1"
    digest: ""
  - name: rustfs/rustfs
    newName: wasm-agent-registry-vpc.cn-hangzhou.cr.aliyuncs.com/wasm-poc/rustfs
    newTag: 1.0.0-beta.3
    digest: ""
  - name: amazon/aws-cli
    newName: wasm-agent-registry-vpc.cn-hangzhou.cr.aliyuncs.com/wasm-poc/aws-cli
    newTag: "2.17.0"
    digest: ""
  - name: busybox
    newName: wasm-agent-registry-vpc.cn-hangzhou.cr.aliyuncs.com/wasm-poc/busybox
    newTag: "1.36"
    digest: ""

# Alibaba Cloud disk CSI refuses volumes below 20Gi; the upstream 1Gi requests
# are sized for kind's local-path provisioner.
patches:
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: rustfs-data
        namespace: ate-system
      spec:
        resources:
          requests:
            storage: 20Gi
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: valkey-cluster
        namespace: ate-system
      spec:
        volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes: [ "ReadWriteOnce" ]
            resources:
              requests:
                storage: 20Gi
