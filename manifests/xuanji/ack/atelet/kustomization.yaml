apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../ate-install/atelet.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: atelet
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: atelet
              args:
              - --gcp-auth-for-image-pulls=false
              - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
              - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
              # Debug while the wasm class is being brought up: the interesting
              # failures (asset fetch, OCI bundle prep, ateom dial) are only
              # visible per-item at this level.
              - --log-level=debug
              # The OTLP endpoint comes from the ate-otel-config ConfigMap this
              # DaemonSet consumes via envFrom (../../../ate-install/kind/ate-otel-config.yaml,
              # listed by the parent overlay).
              env:
              - name: ATE_STORAGE_BACKEND
                value: s3
              # In-cluster rustfs stands in for OSS during M2. atelet builds its
              # S3 client from the standard AWS SDK environment (cmd/atelet/main.go
              # LoadDefaultConfig), so switching to OSS is purely these vars:
              # point AWS_ENDPOINT_URL at oss-cn-hangzhou-internal.aliyuncs.com,
              # set AWS_S3_USE_PATH_STYLE=false (OSS wants virtual-hosted style)
              # and source the keys from a Secret instead of literals.
              - name: AWS_REGION
                value: us-east-1
              - name: AWS_ENDPOINT_URL
                value: http://rustfs.ate-system.svc:9000
              - name: AWS_S3_USE_PATH_STYLE
                value: "true"
              - name: AWS_ACCESS_KEY_ID
                value: rustfsadmin
              - name: AWS_SECRET_ACCESS_KEY
                value: rustfsadmin
