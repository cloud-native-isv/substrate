# 项目输入表单（project-input/v1）—— **虚构样例**，仅供试跑与自检用
#
# ⚠ 本文件里的**每一个值都是编造的**（项目名、阶段划分、任务名、日期、人名、计数、来源路径）。
#   它只用于固定**字段结构与取值形态**：
#     - **不得**把这里的任何值当作规则依据、默认值或"典型项目长这样"的样本；
#     - **不得**被 SKILL.md / references/ 的任何规则、判据、检查项引用为依据；
#     - 换一个真实项目时全部字段值都会变（可移植性纪律见 ../references/portability.md）。
#
# 空白模板见 project-input.template.yaml；字段业务含义与必填档位见 references/required-info.md；
# 字段类型/取值域/关联约束的权威是 ../schema/project.sql（DDL，由数据库强制）。
#
# 试跑（三步全走 SQL，装载即校验）：
#   python3 ../scripts/project-db.py --db /tmp/project.db --load project-input.example.yaml
#   python3 ../scripts/project-db.py --db /tmp/project.db --check
#   python3 ../scripts/project-db.py --db /tmp/project.db --export-json /tmp/progress-data.json
#   python3 ../scripts/progress-engine.py --db /tmp/project.db --summary --quiet-json

