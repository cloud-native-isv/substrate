<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECharts Visualization</title>
  <!-- ECharts version PINNED to 5.6.0 (never use a floating echarts@5 tag).
       Offline-first loader: the vendored local copy is the primary source, the
       pinned CDN is only a fallback. The local copy MUST actually exist —
       fetch it with: bash scripts/vendor-echarts.sh <deliverable-dir>
       (downloads https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js
       into vendor/echarts.min.js and verifies it).
       Never ship a loader that references vendor/ without the file, and never
       use document.write for this loader (deprecated/blocking/CSP-hostile).
       Where practical, add integrity/crossorigin (SRI) attributes. -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'vendor/echarts.min.js';
      s.async = false;
      s.onerror = function () {
        var c = document.createElement('script');
        c.src = 'https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js';
        c.async = false;
        document.head.appendChild(c);
      };
      document.head.appendChild(s);
    })();
  </script>
  <style>
    /* INLINE-VERBATIM: skills/draw-diagram/assets/delivery.css
       页面骨架样式（背景/卡片/标题/正文/图框/复现附录/暗色/打印）的唯一 owner 是上面那个文件。
       生成产物时把它**逐字节复制**到本 <style> 块此处 —— 不凭记忆重写、不改数值、
       不用 <link> 外链（外链会让 HTML 单独打开时失去样式，违反交付契约 D1）。
       下面只写本引擎的**图表内部**样式。 */

    /* ECharts 需要一个有确定高度的宿主；白底保证暗色模式下画布里的默认墨色仍可读 */
    #chart { height: 500px; }
  </style>
</head>
<body>
  <main class="container">
    <div id="chart"></div>
  </main>
  <script>
    // ============================================================
    // Initialize ECharts instance
    // ============================================================
    const chart = echarts.init(document.getElementById('chart'));

    // ============================================================
    // Data (replace with your data)
    // ============================================================
    const data = [
      { name: '类目A', value: 30 },
      { name: '类目B', value: 86 },
      { name: '类目C', value: 45 },
      { name: '类目D', value: 72 },
      { name: '类目E', value: 58 }
    ];

    // ============================================================
    // Chart Option Configuration
    // ============================================================
    const option = {
      title: {
        text: 'Chart Title',
        left: 'center'
      },
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' }
      },
      toolbox: {
        feature: {
          saveAsImage: { title: '保存为图片' }
        }
      },
      xAxis: {
        type: 'category',
        data: data.map(d => d.name)
      },
      yAxis: {
        type: 'value'
      },
      series: [
        {
          type: 'bar',
          data: data.map(d => d.value),
          itemStyle: {
            borderRadius: [4, 4, 0, 0]
          }
        }
      ]
    };

    // ============================================================
    // Render Chart
    // ============================================================
    chart.setOption(option);

    // ============================================================
    // Responsive Resize
    // ============================================================
    window.addEventListener('resize', function() {
      chart.resize();
    });
  </script>
</body>
</html>
