<!DOCTYPE html>
<!--
  ============================================================
  复现附录（Reproduction Appendix）— 保留本注释块，交付时按需更新
  - 打开本文件即可渲染：无构建步骤；CDN 模式需联网，split/vendored 模式离线可用
  - 数据维护：单文件模式改下方 const data；split 模式改同目录 data-*.js
    · nodes / links / rels / cells 数组分别对应图面的节点、连线、矩阵格
    · 修改后刷新浏览器即重新渲染
  - 坐标规则（若用手工坐标）：记录分区/栅格约定于此处，如
    panel A: x∈[40,360] y∈[40,300]，节点槽位 24px 栅格；渲染前跑重叠/越界校验
  - 数据溯源：依据 <架构描述文件> v<版本>（<YYYY-MM-DD>）
  ============================================================
-->
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3.js Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    /* INLINE-VERBATIM: skills/draw-diagram/assets/delivery.css
       页面骨架样式（背景/卡片/标题/正文/图框/复现附录/暗色/打印）的唯一 owner 是上面那个文件。
       生成产物时把它**逐字节复制**到本 <style> 块此处 —— 不凭记忆重写、不改数值、
       不用 <link> 外链（外链会让 HTML 单独打开时失去样式，违反交付契约 D1）。
       下面只写本引擎的**图表内部**样式。 */

    /* #chart 是本引擎的图表宿主：白底保证暗色模式下 SVG 里的 #333 墨色仍可读 */
    #chart { background: #fff; border-radius: 8px; }
    /* .chart-title 是 SVG <text>，需要 SVG 专有属性（骨架表只给字号/字重） */
    .chart-title { text-anchor: middle; fill: #333; }
    .axis text { font-size: 12px; fill: #666; }
    .axis line, .axis path { stroke: #ddd; }
    .tooltip {
      position: absolute;
      visibility: hidden;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <main class="container">
  <div class="toolbar">
    <button id="btn-export-svg" type="button">导出 SVG</button>
    <button id="btn-export-png" type="button">导出 PNG</button>
  </div>
  <div id="chart"></div>
  <div class="tooltip"></div>
  <details class="repro-appendix">
    <summary>复现附录：如何修改数据与重新渲染</summary>
    <ul>
      <li>打开本文件即可渲染，无构建步骤；CDN 模式需联网，vendored 模式离线可用。</li>
      <li>数据位置：单文件模式位于下方 <code>const data</code>；split 模式位于同目录 <code>data-*.js</code>（nodes / links / rels / cells 对应图面各部分）。</li>
      <li>修改数据后刷新浏览器即重新渲染；手工坐标图请同步更新文件头坐标规则并跑校验。</li>
      <li>数据溯源：依据 <code>&lt;架构描述文件&gt; v&lt;版本&gt;（&lt;YYYY-MM-DD&gt;）</code>。</li>
    </ul>
  </details>
  </main>
  <script>
    // ============================================================
    // Configuration
    // ============================================================
    const margin = { top: 40, right: 30, bottom: 50, left: 60 };
    const width = 800 - margin.left - margin.right;
    const height = 500 - margin.top - margin.bottom;

    // ============================================================
    // Data (replace with your data)
    // ============================================================
    const data = [
      { name: "Category A", value: 30 },
      { name: "Category B", value: 86 },
      { name: "Category C", value: 45 },
      { name: "Category D", value: 72 },
      { name: "Category E", value: 58 }
    ];

    // ============================================================
    // SVG Setup
    // ============================================================
    const svg = d3.select("#chart")
      .append("svg")
        .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
        .attr("preserveAspectRatio", "xMidYMid meet")
        .style("width", "100%")
        .style("height", "auto")
      .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    // ============================================================
    // Scales
    // ============================================================
    const xScale = d3.scaleBand()
      .domain(data.map(d => d.name))
      .range([0, width])
      .padding(0.2);

    const yScale = d3.scaleLinear()
      .domain([0, d3.max(data, d => d.value)])
      .range([height, 0])
      .nice();

    const colorScale = d3.scaleOrdinal(d3.schemeTableau10);

    // ============================================================
    // Axes
    // ============================================================
    svg.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(xScale));

    svg.append("g")
      .attr("class", "axis")
      .call(d3.axisLeft(yScale).ticks(5));

    // ============================================================
    // Chart Title
    // ============================================================
    svg.append("text")
      .attr("class", "chart-title")
      .attr("x", width / 2)
      .attr("y", -15)
      .text("Chart Title");

    // ============================================================
    // Draw Elements (replace with your chart logic)
    // ============================================================
    // TODO: Replace with actual visualization code

    // ============================================================
    // Tooltip (optional)
    // ============================================================
    const tooltip = d3.select(".tooltip");

    // ============================================================
    // Export: SVG serialization + PNG via Canvas (static snapshot)
    // ============================================================
    function exportSVG(filename = "chart.svg") {
      const svgNode = document.querySelector("#chart svg");
      const clone = svgNode.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", svgNode.viewBox.baseVal.width);
      clone.setAttribute("height", svgNode.viewBox.baseVal.height);
      // 若导出的 SVG 样式缺失，先内联关键样式（font-size / fill）到 clone 中
      const blob = new Blob([new XMLSerializer().serializeToString(clone)],
                            { type: "image/svg+xml;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function exportPNG(filename = "chart.png", scale = 2) {
      const svgNode = document.querySelector("#chart svg");
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = svgNode.viewBox.baseVal.width * scale;
        canvas.height = svgNode.viewBox.baseVal.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = filename;
        a.click();
      };
      img.src = "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(new XMLSerializer().serializeToString(svgNode));
    }

    document.getElementById("btn-export-svg").addEventListener("click", () => exportSVG());
    document.getElementById("btn-export-png").addEventListener("click", () => exportPNG());
  </script>
</body>
</html>
