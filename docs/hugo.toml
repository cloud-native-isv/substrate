# Hugo configuration for this project's documentation space.
# Generated by create-docs (scaffold-hugo.py). docs/ is the Hugo project root AND
# the single content source: every content path is *mounted*, never copied, so the
# Markdown tree stays pure and no file is duplicated.
#
# Edit this file freely — only the managed mount block at the bottom is regenerated.

baseURL = "/"
languageCode = "en"
title = "Xuanji Substrate 文档"

# Repo-native relative Markdown links (`../concepts/overview.md`) keep working on the
# rendered site because layouts/_default/_markup/render-link.html resolves each link
# through Hugo's page graph and emits the target's real URL — so the default pretty-URL
# scheme is kept, and no link rewriting is needed in the Markdown itself.
# relativeURLs keeps every generated URL relative, so the built site also works when
# hosted under a sub-path and when browsed straight off disk.
relativeURLs = true
disableKinds = ["taxonomy", "term", "RSS"]

[markup.goldmark.renderer]
  unsafe = true   # documentation legitimately contains raw HTML (<details>, <br>, badges)

[markup.highlight]
  noClasses = true   # self-contained styling; no chroma stylesheet to ship

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  description = "Project documentation"

# Hand-maintained mount, deliberately OUTSIDE the managed block below (which is
# regenerated by scaffold-hugo.py and would drop it): the scaffolder classifies only
# docs/ *subdirectories*, so the upstream Markdown sitting directly in docs/
# (architecture.md, overview.md, glossary.md, api-guide.md, roadmap.md, threat-model.md,
# observability.md, request-parking.md, api-style-guide.md, code-style-guide.md) was never
# published — which also broke every relative link pointing at it (e.g. ../overview.md).
# Only root-level files are taken here; each subdirectory keeps its own mount below.
[[module.mounts]]
  source = "."
  target = "content"
  includeFiles = ["/*.md"]

# Hand-maintained, also outside the managed block. docs/concepts/core-concepts.md and
# docs/reference/actor-lifecycle-flows.md embed their diagrams with raw HTML
# (<a href="../figures/x.svg"><img src="../figures/x.png"></a>) to get click-to-zoom.
# Raw HTML bypasses Hugo's render hooks, so those repo-relative paths are emitted verbatim
# and — because each page is served one level deeper as /<section>/<page>/ — resolve to
# /concepts/figures/ and /reference/figures/, which do not exist. Publishing figures at
# both section-relative paths keeps the Markdown repo-native and the images working.
[[module.mounts]]
  source = "figures"
  target = "static/concepts/figures"

[[module.mounts]]
  source = "figures"
  target = "static/reference/figures"

# Same reason, bare-relative variant: docs/overview.md is a root-level page and writes
# src="figures/x.png" (no ../), which resolves to /overview/figures/ once published.
[[module.mounts]]
  source = "figures"
  target = "static/overview/figures"

